<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AlgoPuzzle</title>
<!-- Self-hosted, version-pinned (Tailwind 3.4.17 / Blockly 13.2.1) instead
     of loading from unpkg/cdn.tailwindcss.com at runtime - avoids the app
     going down (or silently breaking on an unannounced upstream update)
     whenever a third-party CDN we don't control has a bad day. See
     assets/vendor/. -->
<!-- Precompiled Tailwind (see DEPLOYMENT.md step 0) - NOT the Play CDN
     JIT script. Adding a new Tailwind class anywhere requires
     `npm run build:css` or it silently won't be styled. -->
<link rel="stylesheet" href="assets/vendor/tailwind/tailwind-compiled.css" />
<script src="assets/vendor/blockly/blockly_compressed.js"></script>
<script src="assets/vendor/blockly/blocks_compressed.js"></script>
<script src="assets/vendor/blockly/msg/en.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  #blocklyDiv { height: 100%; width: 100%; }
  .blocklyToolboxDiv { background-color: #111827 !important; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen overflow-hidden">

          <path d="M90,0 L150,0 A10,10 0 0,1 160,10 L160,70 A10,10 0 0,1 150,80 L134,80 A14,14 0 0,1 106,80 L90,80 A10,10 0 0,1 80,70 L80,54 A14,14 0 0,0 80,26 L80,10 A10,10 0 0,1 90,0 Z" fill="#10b981" stroke="#059669" stroke-width="3"/>
          <path d="M10,80 L26,80 A14,14 0 0,0 54,80 L70,80 A10,10 0 0,1 80,90 L80,106 A14,14 0 0,1 80,134 L80,150 A10,10 0 0,1 70,160 L10,160 A10,10 0 0,1 0,150 L0,90 A10,10 0 0,1 10,80 Z" fill="#10b981" stroke="#059669" stroke-width="3"/>
          <path d="M90,80 L106,80 A14,14 0 0,0 134,80 L150,80 A10,10 0 0,1 160,90 L160,150 A10,10 0 0,1 150,160 L90,160 A10,10 0 0,1 80,150 L80,134 A14,14 0 0,0 80,106 L80,90 A10,10 0 0,1 90,80 Z" fill="#f9fafb" stroke="#059669" stroke-width="3"/>
          <path d="M94,62 L112,42 L104,48 L138,14 L126,18 M138,14 L138,26" stroke="#f9fafb" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="18" y="126" width="10" height="20" rx="2" fill="#f9fafb"/>
          <rect x="34" y="110" width="10" height="36" rx="2" fill="#f9fafb"/>
          <rect x="50" y="118" width="10" height="28" rx="2" fill="#f9fafb"/>
        </g>
      </svg>
      <h1 class="text-lg font-semibold tracking-tight">Algo<span class="text-emerald-400">Puzzle</span></h1>
      <span class="hidden sm:inline-block ml-2 text-xs text-gray-500 border border-gray-700 rounded px-2 py-0.5">MVP</span>
    </div>
    <div class="flex flex-wrap items-center gap-2 sm:gap-3">
      <div class="flex items-center gap-1 sm:gap-2 pr-2 sm:pr-3 mr-1 border-r border-gray-800">
        <button id="newStrategyBtn" title="Start a new, blank strategy"
          class="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-gray-200 text-sm font-medium px-2 sm:px-3 py-2 rounded-md transition flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="hidden sm:inline">New</span>
        </button>
        <button id="openStrategiesBtn" title="My Strategies"
          class="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-gray-200 text-sm font-medium px-2 sm:px-3 py-2 rounded-md transition flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6a2 2 0 012-2h4l2 2h6a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V6z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>

          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 4h11l4 4v12a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 4v5h8V4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 20v-6h8v6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="hidden sm:inline">Save</span>

      </div>

      <!-- Only shown once actually logged in (30-day pass account - see

           logged out always gets a visible way in, logged in always

           persistent sign of the login feature at all. -->
      <span id="authStatusLoggedOut" class="items-center text-xs text-gray-400">
        <button id="authHeaderLoginBtn" class="underline hover:text-gray-200">Log in</button>
      </span>
      <span id="authStatusLoggedIn" class="hidden items-center gap-2 text-xs text-gray-400 max-w-[45vw] sm:max-w-none">
        <span id="authStatusEmail" class="truncate max-w-[28vw] sm:max-w-none"></span>

    <div id="blocklyDiv" class="absolute inset-0"></div>
  </main>

  <!-- Toolbox -->
  <xml id="toolbox" style="display: none">
    <category name="Conditions" colour="#d97706">
      <block type="comparison_block"></block>
      <block type="logical_operator"></block>
    </category>
    <category name="Price &amp; Volume" colour="#0891b2">
      <block type="candle_block"></block>
      <block type="volume_block"></block>
    </category>
    <category name="Indicators" colour="#7c3aed">
      <block type="indicator_ma"></block>
      <block type="indicator_rsi"></block>
      <block type="indicator_macd"></block>
      <block type="indicator_bands"></block>
      <block type="indicator_atr"></block>
      <block type="indicator_stoch"></block>
    </category>
    <category name="THEN" colour="#059669">
      <block type="action_block"></block>
    </category>
    <category name="Risk &amp; Sizing" colour="#0d9488">
      <block type="risk_value_block"></block>
      <block type="math_multiply_block"></block>
      <block type="math_number"></block>
    </category>
    <sep></sep>
    <!-- Separated from the rest on purpose: this is for adding an extra
         top-level rule to an existing strategy (multi-rule), not
         something a trader reaches for while building out one rule's
         conditions/actions. The shadow blocks pre-fill Asset (EUR/USD)
         and Timeframe (M1) the moment it's dragged in - a trader only
         ever changes a value here, never hunts for what plugs in where.
         Shadows can't be dragged out on their own, only replaced. -->
    <category name="Add Rule" colour="#059669">
      <block type="trade_if">
        <value name="ASSET">
          <shadow type="asset_block"></shadow>
        </value>
        <value name="TIMEFRAME">
          <shadow type="timeframe_block"></shadow>
        </value>
      </block>
    </category>
  </xml>

  <!-- Error / info toast -->

       color alone is an easy thing to miss/misread, especially at a
       glance, so every state is redundantly signaled three ways. -->

       returns 402). Single export stays anonymous - paying just unlocks

       30-day pass now needs a quick login first (see the AUTH section
       further down) since it's meant to follow the trader across
       devices, not just this browser. Either way, "Pay" hands off to
       Stripe's own hosted Checkout page - this app never touches a card

<script>
/* ============================================================
   1. CUSTOM BLOCK DEFINITIONS
   ============================================================ */

// A FieldDropdown whose popup adds a search box up top - the plain
// Blockly menu widget doesn't support filtering, and with 75 assets in
// the list below, scrolling to find one by hand isn't realistic. Built on
// Blockly.DropDownDiv, the same public API Blockly's own rich fields
// (colour picker, angle picker, etc.) use for a custom popup - only the
// Asset field needs this, every other dropdown in this app has few enough
// options that the stock menu is fine.
class FieldSearchableDropdown extends Blockly.FieldDropdown {
  showEditor_() {
    Blockly.DropDownDiv.clearContent();
    const contentDiv = Blockly.DropDownDiv.getContentDiv();

    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'display:flex;flex-direction:column;width:240px;font-family:inherit;';

    // Same stroke-icon style as every other icon in this app (header
    // buttons, export buttons) - not an emoji.
    const searchBox = document.createElement('div');
    searchBox.style.cssText = 'position:relative;margin:6px;';
    searchBox.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" '
      + 'style="position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none;">'
      + '<circle cx="11" cy="11" r="7" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<path d="M21 21l-4.35-4.35" stroke-linecap="round" stroke-linejoin="round"/>'
      + '</svg>';

    const searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.placeholder = 'Search assets...';
    searchInput.style.cssText = 'width:100%;padding:6px 8px 6px 28px;border-radius:6px;border:1px solid #4b5563;background:#111827;color:#e5e7eb;font-size:13px;outline:none;box-sizing:border-box;';
    searchBox.appendChild(searchInput);

    const listEl = document.createElement('div');
    listEl.style.cssText = 'max-height:260px;overflow-y:auto;padding:0 4px 6px;';

    const options = this.getOptions(false);
    const currentValue = this.getValue();

    const renderList = (filterText) => {
      listEl.innerHTML = '';
      const q = filterText.trim().toLowerCase();
      // CUSTOM is handled as its own always-present row below, not as a
      // regular searchable entry (avoids listing it twice).
      const searchable = options.filter(([, value]) => value !== 'CUSTOM');
      const filtered = q
        ? searchable.filter(([text, value]) => text.toLowerCase().includes(q) || value.toLowerCase().includes(q))
        : searchable;

      if (filtered.length === 0) {
        const empty = document.createElement('div');
        empty.textContent = 'No matches in the list';
        empty.style.cssText = 'padding:8px 8px 4px;color:#9ca3af;font-size:13px;';
        listEl.appendChild(empty);
      } else {
        filtered.forEach(([text, value]) => {
          const item = document.createElement('div');
          item.textContent = text;
          item.dataset.selectable = 'true';
          const isSelected = value === currentValue;
          item.style.cssText = 'padding:6px 8px;border-radius:4px;cursor:pointer;font-size:13px;color:#e5e7eb;'
            + (isSelected ? 'background:#374151;font-weight:600;' : '');
          item.addEventListener('mouseenter', () => { item.style.background = '#374151'; });
          item.addEventListener('mouseleave', () => { item.style.background = isSelected ? '#374151' : ''; });
          // Keep the search input focused instead of stealing focus on click.
          item.addEventListener('mousedown', (e) => e.preventDefault());
          item.addEventListener('click', () => {
            this.setValue(value);
            Blockly.DropDownDiv.hideIfOwner(this);
          });
          listEl.appendChild(item);
        });
      }

      // Custom / Other... is always reachable, not just when nothing
      // matches - but it's what a trader actually needs whenever their
      // broker's symbol isn't in the built-in list. Pre-fills the typed
      // search text as the starting symbol.
      const typed = filterText.trim().toUpperCase();
      const customItem = document.createElement('div');
      customItem.textContent = typed ? `Use "${typed}" (Custom / Other...)` : 'Custom / Other...';
      customItem.dataset.selectable = 'true';
      const customIsSelected = currentValue === 'CUSTOM';
      customItem.style.cssText = 'padding:6px 8px;border-radius:4px;cursor:pointer;font-size:13px;color:#7dd3fc;'
        + 'margin-top:4px;border-top:1px solid #374151;padding-top:8px;'
        + (customIsSelected ? 'background:#374151;font-weight:600;' : '');
      customItem.addEventListener('mouseenter', () => { customItem.style.background = '#374151'; });
      customItem.addEventListener('mouseleave', () => { customItem.style.background = customIsSelected ? '#374151' : ''; });
      customItem.addEventListener('mousedown', (e) => e.preventDefault());
      customItem.addEventListener('click', () => {
        this.setValue('CUSTOM');
        const block = this.sourceBlock_;
        if (block && block.updateCustomAssetShape_) {
          block.updateCustomAssetShape_('CUSTOM');
          if (typed) block.setFieldValue(typed, 'CUSTOM_ASSET');
        }
        Blockly.DropDownDiv.hideIfOwner(this);
      });
      listEl.appendChild(customItem);
    };

    searchInput.addEventListener('input', () => renderList(searchInput.value));
    searchInput.addEventListener('keydown', (e) => {
      e.stopPropagation(); // don't let Blockly's own shortcut handling eat these keystrokes
      if (e.key === 'Escape') {
        Blockly.DropDownDiv.hideIfOwner(this);
      } else if (e.key === 'Enter') {
        // The "No matches" text (if present) isn't selectable - skip to
        // the first row that actually is (a real match, or Custom/Other).
        const first = listEl.querySelector('[data-selectable]');
        if (first) first.click();
      }
    });

    renderList('');
    wrapper.appendChild(searchBox);
    wrapper.appendChild(listEl);
    contentDiv.appendChild(wrapper);

    Blockly.DropDownDiv.setColour('#1f2937', '#4b5563');
    Blockly.DropDownDiv.showPositionedByField(this, () => {});
    setTimeout(() => searchInput.focus(), 0);
  }
}

/* ============================================================
   1b. VALUE CATEGORY SYSTEM (semantic unit compatibility)
   ============================================================
   Every value-producing block belongs to a measurement "category" so the
   editor can stop traders from building comparisons/multiplications that
   silently mix incompatible units - e.g. "Previous Low > Current Bar
   Volume" (a price level vs. a tick count). Two values may be compared
   or multiplied only if they share the same category, or if either side
   is a plain Number (a universal wildcard - the trader picks the literal
   knowing what it's being tested against, e.g. "RSI > 70").

   Risk Value has no fixed category of its own (it's a distance/percent
   meant for Stop Loss / Take Profit) and is intentionally excluded from
   Condition entirely - it still works fine in SL/TP and inside Multiply. */

const VALUE_CATEGORY = {
  candle_block: 'Price',
  indicator_ma: 'Price',
  indicator_bands: 'Price',
  indicator_rsi: 'Oscillator',
  indicator_stoch: 'Oscillator',
  indicator_atr: 'Volatility',
  indicator_macd: 'Macd',
  volume_block: 'Volume',
  math_number: 'Number',
};
const ALL_CATEGORIES = ['Price', 'Oscillator', 'Volatility', 'Macd', 'Volume', 'Number'];
// Base check for sockets that accept *any* value regardless of category
// (Stop Loss / Take Profit, and the two Multiply inputs) - 'Indicator' is
// what Risk Value (and an unresolved Multiply) carries, since those can't
// be proven wrong and shouldn't be blocked from these slots.
const ANY_VALUE_CHECK = ['Indicator', ...ALL_CATEGORIES];
const CATEGORY_LABEL = {
  Price: 'a price value',
  Oscillator: 'an oscillator (0-100) value',
  Volatility: 'a volatility (ATR) value',
  Macd: 'a MACD value',
  Volume: 'a volume value',
  Number: 'a number',
};

// Resolves the category of whatever is plugged into a value slot:
//  - a fixed-category block -> its category string (e.g. 'Price')
//  - an empty slot -> null
//  - Risk Value, or an incomplete Multiply -> 'Unknown' (deliberately
//    permissive: allowed into Multiply / SL/TP, but can never enter a
//    Comparison, since Comparison only accepts specific categories + Number)
//  - a Multiply whose own two operands are provably incompatible ->
//    'Conflict' (e.g. ATR x Volume - never allowed anywhere)
function resolveCategory(block) {
  if (!block) return null;
  if (VALUE_CATEGORY[block.type]) return VALUE_CATEGORY[block.type];
  if (block.type === 'math_multiply_block') {
    const a = resolveCategory(block.getInputTargetBlock('A'));
    const b = resolveCategory(block.getInputTargetBlock('B'));
    if (a === 'Conflict' || b === 'Conflict') return 'Conflict';
    if (!a || !b || a === 'Unknown' || b === 'Unknown') return 'Unknown';
    if (a === 'Number') return b;
    if (b === 'Number') return a;
    if (a === b) return a;
    return 'Conflict'; // e.g. ATR x Volume - genuinely incompatible units
  }
  return 'Unknown'; // e.g. risk_value_block
}

// True if two resolved categories may be combined (compared or multiplied).
function categoriesCompatible(a, b) {
  if (a === 'Conflict' || b === 'Conflict') return false;
  if (a === null || b === null) return true; // an empty slot is never itself a violation
  if (a === 'Unknown' || b === 'Unknown') return true; // can't prove it's wrong - allow
  if (a === 'Number' || b === 'Number') return true;
  return a === b;
}

// Condition (Comparison) slots are stricter than Multiply/SL-TP: only a
// genuinely-measurable, specific category (or a plain Number) may sit
// there - Risk Value and ambiguous Multiply results are turned away.
function categoryAllowedInCondition(cat) {
  return cat !== null && cat !== 'Unknown' && cat !== 'Conflict';
}

function categoryLabel(cat) {
  return CATEGORY_LABEL[cat] || 'this value';
}

      this.appendDummyInput('MAX_POSITIONS_ROW')

  // own, but the MAX_POSITIONS_ROW input only exists at all when

  // localStorage) doesn't have that input yet until updatePositionsShape_
  // runs, so a saved MAX_POSITIONS value would have nowhere to land.
  // saveExtraState/loadExtraState is Blockly's supported hook for exactly
  // this ("shape depends on a field") case: loadExtraState runs before
  // field values are restored, so it rebuilds the shape just in time.
  saveExtraState: function () {
    return { positionsMode: this.getFieldValue('POSITIONS_MODE') };
  },
  loadExtraState: function (state) {
    this.updatePositionsShape_(state.positionsMode);
  }
};

// Creates a fresh trade_if rule with a default Asset (first option,
// EUR/USD) and Timeframe (first option, M1) already plugged into its
// ASSET/TIMEFRAME inputs - a trader only ever needs to change a value,
// never hunt through the toolbox for which block goes in which slot.
// Used for the very first block on a blank canvas, "New", and "Add Rule".
function createDefaultRuleBlock(x, y) {
  const ifBlock = workspace.newBlock('trade_if');
  ifBlock.initSvg();

  // setShadow(true) matches the "Add Rule" toolbox entry (see toolbox
  // XML) - these can be edited (change the dropdown) but not dragged
  // out on their own, so a trader can't accidentally end up with an
  // empty Asset/Timeframe slot again.
  const assetBlock = workspace.newBlock('asset_block');
  assetBlock.setShadow(true);
  assetBlock.initSvg();
  ifBlock.getInput('ASSET').connection.connect(assetBlock.outputConnection);

  const timeframeBlock = workspace.newBlock('timeframe_block');
  timeframeBlock.setShadow(true);
  timeframeBlock.initSvg();
  ifBlock.getInput('TIMEFRAME').connection.connect(timeframeBlock.outputConnection);

  ifBlock.render();
  // moveBy is relative to wherever Blockly happened to spawn the block,
  // which isn't reliably (0,0) once the workspace already has content -
  // read the actual spawn position back and move by the delta to land
  // on the real target (x, y) in workspace coordinates.
  const spawnXY = ifBlock.getRelativeToSurfaceXY();
  ifBlock.moveBy(x - spawnXY.x, y - spawnXY.y);
  return ifBlock;
}

      toolboxBackgroundColour: '#111827',
      toolboxForegroundColour: '#e5e7eb',
      flyoutBackgroundColour: '#1f2937',
      flyoutForegroundColour: '#e5e7eb',
      scrollbarColour: '#374151',
    },
    // math_number is Blockly's built-in block (no custom setColour of our
    // own), so it's re-coloured here to match the Risk & Sizing category
    // it now lives in, instead of editing the block definition itself.
    blockStyles: {
      math_blocks: {
        colourPrimary: '#0d9488',
      },
    },
  }),
  grid: { spacing: 25, length: 3, colour: '#1f2937', snap: true },
  zoom: { controls: true, wheel: true, startScale: 0.9 },
  trashcan: true,
});

/* ============================================================
   2c. STRATEGY AUTO-SAVE (Tier 0 - this browser only)
   ============================================================
   Silently persists the workspace to this browser's localStorage so a
   refresh or accidental tab close doesn't lose work. Device-local only -
   nothing ever leaves the browser: no account, no server call, nothing
   for us to host or be responsible for. This is step 1 of a larger
   tiered plan (see project notes / chat history) - later tiers may add
   an exportable file, a shareable link, or optional bring-your-own-cloud
   sync, but none of that is implemented here. Declared right after the
   workspace is created (before the restore-or-seed step below needs it,
   and before section 2b) so nothing here ever runs into a
   temporal-dead-zone ordering issue. */

const AUTOSAVE_KEY = 'algoPuzzle.workspace.v1';
const AUTOSAVE_DEBOUNCE_MS = 500;

// One-time migration from the old "Scratch for Traders" localStorage key -
// carries forward any draft saved before the rename instead of silently
// losing it. Safe to remove once we're confident nobody has the old key
// left in their browser anymore.
(function migrateLegacyAutosaveKey() {
  try {
    const legacy = localStorage.getItem('scratchForTraders.workspace.v1');
    if (legacy && !localStorage.getItem(AUTOSAVE_KEY)) {
      localStorage.setItem(AUTOSAVE_KEY, legacy);
    }
  } catch (err) { /* best-effort - auto-save migration isn't critical */ }
})();

// Which saved strategy (see section 2d) is currently open, if any - null
// means the canvas holds a fresh/unsaved draft with no library entry yet.
// Persisted alongside the draft itself so a page reload still remembers
// what you were editing (see saveWorkspaceToLocalStorage/loadWorkspace...
// below). `hasUnsavedChanges` tracks whether the canvas has drifted from
// whatever was last explicitly Saved/Loaded/New'd - used to warn before
// New/Load would silently discard in-progress edits.
let currentStrategyId = null;
let hasUnsavedChanges = false;
// Blockly can fire a few more BLOCK_MOVE events right after a programmatic
// load/render (e.g. settling block positions) that have nothing to do with
// the trader actually editing anything. `markSynced()` resets the dirty
// flag *and* briefly suppresses it being re-armed by that trailing noise.
let ignoreChangesUntil = 0;
function markSynced() {
  hasUnsavedChanges = false;
  ignoreChangesUntil = Date.now() + 300;
}

// Looks up the status element itself rather than closing over a
// module-level const, so this is safe to call during the very first
// synchronous page-load pass, before the <script> section that declares
// `statusMsg` has run.
function flashStatus(message) {
  const el = document.getElementById('statusMsg');
  if (!el || el.textContent) return; // don't clobber an in-flight export status
  el.textContent = message;
  clearTimeout(flashStatus._t);
  flashStatus._t = setTimeout(() => {
    if (el.textContent === message) el.textContent = '';
  }, 1500);
}

function saveWorkspaceToLocalStorage() {
  try {
    const state = Blockly.serialization.workspaces.save(workspace);
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ version: 1, state, savedAt: Date.now(), currentStrategyId }));
    // Silent by design - this fires on every debounced edit, so surfacing
    // it every time (a "Draft saved" flash) was more noise than signal.
    // Explicit actions (Save/Load/Delete via the header/panel) still show
    // their own toast, since those are user-initiated and worth confirming.
  } catch (err) {
    // Storage full, private-browsing restrictions, a serialization
    // hiccup, etc. - auto-save is a convenience, not a requirement, so
    // fail silently rather than interrupt the trader's work.
    console.warn('AlgoPuzzle: auto-save failed.', err);
  }
}

let autosaveTimer = null;
function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveWorkspaceToLocalStorage, AUTOSAVE_DEBOUNCE_MS);
}

// Returns true if a previously saved draft was found and successfully
// restored - even if that draft happened to be a fully empty canvas, since
// deliberately clearing everything is still the trader's real state and
// shouldn't be silently overwritten by the starter block.
function loadWorkspaceFromLocalStorage() {
  const raw = localStorage.getItem(AUTOSAVE_KEY);
  if (!raw) return false;
  try {
    const saved = JSON.parse(raw);
    if (!saved || !saved.state) return false;
    Blockly.serialization.workspaces.load(saved.state, workspace);
    currentStrategyId = saved.currentStrategyId || null;
    return true;
  } catch (err) {
    console.warn('AlgoPuzzle: could not restore the saved draft, starting fresh.', err);
    localStorage.removeItem(AUTOSAVE_KEY);
    return false;
  }
}

workspace.addChangeListener((event) => {
  if (event.type === Blockly.Events.BLOCK_MOVE ||
      event.type === Blockly.Events.BLOCK_CREATE ||
      event.type === Blockly.Events.BLOCK_DELETE ||
      event.type === Blockly.Events.BLOCK_CHANGE) {
    if (Date.now() >= ignoreChangesUntil) {
      hasUnsavedChanges = true;
    }
    scheduleAutosave();
  }
});

// Best-effort final save in case the debounce timer hasn't fired yet when
// the tab actually closes.
window.addEventListener('beforeunload', () => {
  clearTimeout(autosaveTimer);
  saveWorkspaceToLocalStorage();
});

// Restore the trader's last draft from this browser (see the auto-save
// section above), or seed a starter block so first-time users see the
// shape of a strategy immediately.
if (loadWorkspaceFromLocalStorage()) {
  // What was just restored *is* the saved state, by definition - not
  // "unsaved" relative to itself.
  markSynced();
  // Deferred one tick so the workspace paints first, then the message
  // appears - avoids the status text flashing before anything is visible.
  setTimeout(() => flashStatus('Restored your last draft'), 0);
} else {
  createDefaultRuleBlock(40, 40);
  markSynced();
}

/* ============================================================
   2d. STRATEGIES LIBRARY (Tier 0 - named saves, still this browser only)
   ============================================================
   A named collection of strategies layered on top of the anonymous
   auto-saved draft above - same mechanism (localStorage, zero backend,
   nothing we host), just keyed by name instead of a single slot. Lets a
   trader keep more than one strategy around and switch between them. */

const STRATEGIES_KEY = 'algoPuzzle.strategies.v1';

// Same one-time migration as the autosave key above, for the named
// strategies library.
(function migrateLegacyStrategiesKey() {
  try {
    const legacy = localStorage.getItem('scratchForTraders.strategies.v1');
    if (legacy && !localStorage.getItem(STRATEGIES_KEY)) {
      localStorage.setItem(STRATEGIES_KEY, legacy);
    }
  } catch (err) { /* best-effort - auto-save migration isn't critical */ }
})();

function loadStrategiesLibrary() {
  try {
    const raw = localStorage.getItem(STRATEGIES_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return (parsed && typeof parsed === 'object') ? parsed : {};
  } catch (err) {
    console.warn('AlgoPuzzle: could not read the strategies library, starting empty.', err);
    return {};
  }
}

let strategiesLibrary = loadStrategiesLibrary();

function persistStrategiesLibrary() {
  try {
    localStorage.setItem(STRATEGIES_KEY, JSON.stringify(strategiesLibrary));
  } catch (err) {
    console.warn('AlgoPuzzle: could not save the strategies library.', err);
    showToast('Could not save - your browser storage may be full.', true);
  }
}

function generateStrategyId() {
  return (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
}

// Custom prompt/confirm - window.prompt()/confirm() throw ("not
// supported") in some contexts this app gets previewed in (e.g. a
// sandboxed iframe), so every save/rename/delete/discard interaction
// goes through this instead. Promise-based, backed by the #dialogOverlay
// markup declared in the HTML.
function showDialog({ message, defaultValue = '', isPrompt = false }) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('dialogOverlay');
    const messageEl = document.getElementById('dialogMessage');
    const inputEl = document.getElementById('dialogInput');
    const okBtn = document.getElementById('dialogOkBtn');
    const cancelBtn = document.getElementById('dialogCancelBtn');

    messageEl.textContent = message;
    inputEl.classList.toggle('hidden', !isPrompt);
    if (isPrompt) inputEl.value = defaultValue || '';

    function cleanup(result) {
      overlay.classList.add('hidden');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('keydown', onKeydown);
      overlay.removeEventListener('mousedown', onOverlayClick);
      resolve(result);
    }
    function onOk() {
      cleanup(isPrompt ? inputEl.value : true);
    }
    function onCancel() {
      cleanup(isPrompt ? null : false);
    }
    function onKeydown(e) {
      if (e.key === 'Enter') onOk();
      else if (e.key === 'Escape') onCancel();
    }
    function onOverlayClick(e) {
      if (e.target === overlay) onCancel();
    }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('keydown', onKeydown);
    overlay.addEventListener('mousedown', onOverlayClick);

    overlay.classList.remove('hidden');
    (isPrompt ? inputEl : okBtn).focus();
    if (isPrompt) inputEl.select();
  });
}

function showPromptDialog(message, defaultValue) {
  return showDialog({ message, defaultValue, isPrompt: true });
}
function showConfirmDialog(message) {
  return showDialog({ message, isPrompt: false });
}

// Resolves an asset_block's actual traded symbol - the ASSET dropdown's
// value directly, or whatever was typed into the Symbol field when
// "Custom / Other..." is selected.
function resolveAssetValue(assetBlock) {
  if (!assetBlock) return null;
  const raw = assetBlock.getFieldValue('ASSET');
  return raw === 'CUSTOM' ? assetBlock.getFieldValue('CUSTOM_ASSET') : raw;
}

// Best-effort default name for the "Save" name prompt, based on the asset
// already chosen in the strategy rule, if any.
function suggestStrategyName() {
  try {
    const ruleBlock = workspace.getTopBlocks(true).find(b => b.type === 'trade_if');
    const assetBlock = ruleBlock && ruleBlock.getInputTargetBlock('ASSET');
    const asset = resolveAssetValue(assetBlock);
    return asset ? `${asset} Strategy` : 'My Strategy';
  } catch (err) {
    return 'My Strategy';
  }
}

function writeStrategyEntry(id, name) {
  strategiesLibrary[id] = {
    id,
    name,
    savedAt: Date.now(),
    state: Blockly.serialization.workspaces.save(workspace),
  };
  persistStrategiesLibrary();
}

// The one Save button: always shows the name, pre-filled with whatever
// strategy is currently open (or a suggested default if none is) so the
// name can be adjusted right here - no separate trip through "My
// Strategies" -> Rename needed just to fix a name at save time.
async function handleSaveClick() {
  const openEntry = currentStrategyId ? strategiesLibrary[currentStrategyId] : null;
  const defaultName = openEntry ? openEntry.name : suggestStrategyName();
  const name = await showPromptDialog('Name this strategy:', defaultName);
  if (name === null) return; // cancelled
  const trimmed = name.trim();
  if (!trimmed) {
    showToast('Strategy name cannot be empty.', true);
    return;
  }
  const id = currentStrategyId || generateStrategyId();
  writeStrategyEntry(id, trimmed);
  currentStrategyId = id;
  markSynced();
  saveWorkspaceToLocalStorage();
  showToast(`Saved as "${trimmed}".`, false);
  renderStrategiesList();
}

// Guards New/Load against silently discarding in-progress edits that
// were never explicitly Saved (the anonymous draft auto-save still has
// them, but switching away loses that association with "what you meant
// to keep").
async function confirmDiscardIfNeeded(actionLabel) {
  if (!hasUnsavedChanges) return true;
  return showConfirmDialog(`You have unsaved changes. ${actionLabel} anyway? Unsaved changes will be lost.`);
}

async function handleNewClick() {
  if (!(await confirmDiscardIfNeeded('Start a new strategy'))) return;
  // Only top-level blocks - disposing a block cascades to (and disposes)
  // its own children, so also disposing children separately here would
  // hit already-removed blocks and throw.
  workspace.getTopBlocks(false).forEach(b => b.dispose(false));
  createDefaultRuleBlock(40, 40);
  currentStrategyId = null;
  markSynced();
  saveWorkspaceToLocalStorage();
}

async function handleLoadStrategy(id) {
  const entry = strategiesLibrary[id];
  if (!entry) return;
  if (!(await confirmDiscardIfNeeded(`Load "${entry.name}"`))) return;
  workspace.getTopBlocks(false).forEach(b => b.dispose(false));
  Blockly.serialization.workspaces.load(entry.state, workspace);
  currentStrategyId = id;
  markSynced();
  saveWorkspaceToLocalStorage();
  closeStrategiesPanel();
  showToast(`Loaded "${entry.name}".`, false);
}

async function handleRenameStrategy(id) {
  const entry = strategiesLibrary[id];
  if (!entry) return;
  const name = await showPromptDialog('Rename strategy:', entry.name);
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  entry.name = trimmed;
  persistStrategiesLibrary();
  renderStrategiesList();
}

async function handleDeleteStrategy(id) {
  const entry = strategiesLibrary[id];
  if (!entry) return;
  if (!(await showConfirmDialog(`Delete "${entry.name}"? This can't be undone.`))) return;
  delete strategiesLibrary[id];
  persistStrategiesLibrary();
  if (currentStrategyId === id) {
    currentStrategyId = null;
    saveWorkspaceToLocalStorage();
  }
  renderStrategiesList();
  showToast(`Deleted "${entry.name}".`, false);
}

function formatSavedAt(timestamp) {
  try {
    return new Date(timestamp).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  } catch (err) {
    return '';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderStrategiesList() {
  const listEl = document.getElementById('strategiesList');
  if (!listEl) return;
  const entries = Object.values(strategiesLibrary).sort((a, b) => b.savedAt - a.savedAt);

  if (entries.length === 0) {
    listEl.innerHTML = '<p class="text-sm text-gray-500 text-center py-8 px-4">No saved strategies yet. Build something and hit "Save" to keep it here.</p>';
    return;
  }

  listEl.innerHTML = '';
  entries.forEach((entry) => {
    const row = document.createElement('div');
    row.className = 'flex items-center justify-between gap-2 px-3 py-2.5 rounded-md hover:bg-gray-800';

    const info = document.createElement('div');
    info.className = 'min-w-0 flex-1';
    const isOpen = entry.id === currentStrategyId;
    info.innerHTML = `
      <div class="text-sm font-medium text-gray-100 truncate">${escapeHtml(entry.name)}${isOpen ? ' <span class="text-emerald-400 text-xs font-normal">(currently open)</span>' : ''}</div>
      <div class="text-xs text-gray-500">${formatSavedAt(entry.savedAt)}</div>
    `;

    const actions = document.createElement('div');
    actions.className = 'flex items-center gap-1 shrink-0';

    const loadBtn = document.createElement('button');
    loadBtn.textContent = 'Load';
    loadBtn.className = 'text-xs font-medium bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded';
    loadBtn.addEventListener('click', () => handleLoadStrategy(entry.id));

    const renameBtn = document.createElement('button');
    renameBtn.textContent = 'Rename';
    renameBtn.className = 'text-xs font-medium bg-gray-700 hover:bg-gray-600 text-gray-200 px-2.5 py-1.5 rounded';
    renameBtn.addEventListener('click', () => handleRenameStrategy(entry.id));

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Delete';
    deleteBtn.className = 'text-xs font-medium bg-gray-700 hover:bg-red-700 text-gray-200 px-2.5 py-1.5 rounded';
    deleteBtn.addEventListener('click', () => handleDeleteStrategy(entry.id));

    actions.append(loadBtn, renameBtn, deleteBtn);
    row.append(info, actions);
    listEl.appendChild(row);
  });
}

function openStrategiesPanel() {
  renderStrategiesList();
  document.getElementById('strategiesOverlay').classList.remove('hidden');
}
function closeStrategiesPanel() {
  document.getElementById('strategiesOverlay').classList.add('hidden');
}

document.getElementById('newStrategyBtn').addEventListener('click', handleNewClick);
document.getElementById('saveStrategyBtn').addEventListener('click', handleSaveClick);
document.getElementById('openStrategiesBtn').addEventListener('click', openStrategiesPanel);
document.getElementById('closeStrategiesBtn').addEventListener('click', closeStrategiesPanel);
document.getElementById('strategiesOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'strategiesOverlay') closeStrategiesPanel(); // click outside the card
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !document.getElementById('strategiesOverlay').classList.contains('hidden')) {
    closeStrategiesPanel();
  }
});

/* ============================================================
   2b. VALUE CATEGORY ENFORCEMENT (live, in the editor)
   ============================================================
   Blockly's static setCheck() on comparison_block / math_multiply_block
   (see section 1b) already stops the *obviously* wrong connections
   outright - Blockly just refuses to snap them together. What static
   checks can't express is "the two SIDES must agree with each other"
   (e.g. Price is fine paired with Price, but not with Volume). This
   listener recomputes that pairwise constraint after every block move,
   and - as a safety net for cases that slip through anyway (e.g. a
   Multiply's category resolving only after it's already plugged in) -
   forcibly disconnects the offending block and explains why via toast. */

function disconnectAndWarn(parentBlock, inputName, childBlock, message) {
  const connection = parentBlock.getInput(inputName) && parentBlock.getInput(inputName).connection;
  if (connection && connection.targetConnection) {
    connection.disconnect();
  }
  childBlock.moveBy(40, 40);
  childBlock.bumpNeighbours();
  showToast(message, true);
}

// Restricts `siblingInputName`'s connection to whatever `ownCategory`
// allows - the same category plus Number, or fully permissive if empty/
// Number/unresolved.
function updateSiblingCheck(parentBlock, siblingInputName, ownCategory) {
  const siblingInput = parentBlock.getInput(siblingInputName);
  if (!siblingInput || !siblingInput.connection) return;
  const permissive = !ownCategory || ownCategory === 'Number' || ownCategory === 'Unknown' || ownCategory === 'Conflict';
  siblingInput.connection.setCheck(permissive ? ALL_CATEGORIES.slice() : [ownCategory, 'Number']);
}

function enforceComparisonBlock(block) {
  let leftBlock = block.getInputTargetBlock('LEFT');
  let rightBlock = block.getInputTargetBlock('RIGHT');
  let leftCat = resolveCategory(leftBlock);
  let rightCat = resolveCategory(rightBlock);

  if (leftBlock && !categoryAllowedInCondition(leftCat)) {
    disconnectAndWarn(block, 'LEFT', leftBlock,
      'That block can\'t be used inside a Condition - it\'s meant for Stop Loss / Take Profit instead. Disconnected it.');
    leftBlock = null; leftCat = null;
  }
  if (rightBlock && !categoryAllowedInCondition(rightCat)) {
    disconnectAndWarn(block, 'RIGHT', rightBlock,
      'That block can\'t be used inside a Condition - it\'s meant for Stop Loss / Take Profit instead. Disconnected it.');
    rightBlock = null; rightCat = null;
  }
  if (leftBlock && rightBlock && !categoriesCompatible(leftCat, rightCat)) {
    disconnectAndWarn(block, 'RIGHT', rightBlock,
      `Can't compare ${categoryLabel(leftCat)} to ${categoryLabel(rightCat)} - different units. Disconnected the second block.`);
    rightBlock = null; rightCat = null;
  }

  updateSiblingCheck(block, 'RIGHT', leftCat);
  updateSiblingCheck(block, 'LEFT', rightCat);
}

function enforceMultiplyBlock(block) {
  let aBlock = block.getInputTargetBlock('A');
  let bBlock = block.getInputTargetBlock('B');
  let aCat = resolveCategory(aBlock);
  let bCat = resolveCategory(bBlock);

  if (aBlock && bBlock && !categoriesCompatible(aCat, bCat)) {
    disconnectAndWarn(block, 'B', bBlock,
      `Can't multiply ${categoryLabel(aCat)} by ${categoryLabel(bCat)} - different units. Disconnected the second block.`);
    bBlock = null; bCat = null;
  }

  // Unlike Comparison, Multiply also accepts 'Indicator'-only values
  // (Risk Value, or another unresolved Multiply) on the free side, since
  // those can't be proven wrong - see resolveCategory().
  const siblingCheckFor = (cat) => {
    const permissive = !cat || cat === 'Number' || cat === 'Unknown' || cat === 'Conflict';
    return permissive ? ANY_VALUE_CHECK.slice() : [cat, 'Number', 'Indicator'];
  };
  const aInput = block.getInput('A');
  const bInput = block.getInput('B');
  if (bInput && bInput.connection) bInput.connection.setCheck(siblingCheckFor(aCat));
  if (aInput && aInput.connection) aInput.connection.setCheck(siblingCheckFor(bCat));

  // Propagate the resolved category upward so a Comparison (or another
  // Multiply) plugged into this block's output sees the right constraint.
  const resolved = resolveCategory(block);
  const outCheck = (resolved === 'Unknown' || resolved === 'Conflict')
    ? ['Indicator']
    : resolved === 'Number'
      ? ['Indicator', 'Number']
      : ['Indicator', resolved];
  if (block.outputConnection) block.outputConnection.setCheck(outCheck);
}

let categoryRuleGuard = false;
function refreshValueCategoryRules() {
  if (categoryRuleGuard) return;
  categoryRuleGuard = true;
  try {
    workspace.getBlocksByType('math_multiply_block', false).forEach(enforceMultiplyBlock);
    workspace.getBlocksByType('comparison_block', false).forEach(enforceComparisonBlock);
  } finally {
    categoryRuleGuard = false;
  }
}

workspace.addChangeListener((event) => {
  if (event.type === Blockly.Events.BLOCK_MOVE ||
      event.type === Blockly.Events.BLOCK_CREATE ||
      event.type === Blockly.Events.BLOCK_DELETE) {
    refreshValueCategoryRules();
  }
});

// Blockly quirk (observed on 13.2.1 via the unpkg CDN build): when a
// category flyout auto-closes, Blockly hides the flyout's own <svg> via
// `display: none`, but the flyout's scrollbar is a *sibling* element in the
// DOM (not a child of the flyout), so it never gets hidden along with it -
// leaving a stray vertical scrollbar frozen on screen wherever the flyout
// was last opened. Mirror each flyout's visibility onto its own scrollbar
// to fix that.
(function fixOrphanedFlyoutScrollbars() {
  const injectionDiv = workspace.getInjectionDiv();
  const sync = () => {
    const anyFlyoutOpen = Array.from(injectionDiv.querySelectorAll('svg.blocklyFlyout'))
      .some(f => f.style.display !== 'none');
    injectionDiv.querySelectorAll('svg.blocklyFlyoutScrollbar').forEach(sb => {
      sb.style.display = anyFlyoutOpen ? '' : 'none';
    });
  };
  const observer = new MutationObserver(sync);
  injectionDiv.querySelectorAll('svg.blocklyFlyout').forEach(f => {
    observer.observe(f, { attributes: true, attributeFilter: ['style'] });
  });
  sync();
})();

/* ============================================================
   3. SERIALIZATION: Blockly workspace -> clean backend JSON
   ============================================================ */

class WorkspaceValidationError extends Error {}

function operandFromBlock(block) {
  if (!block) throw new WorkspaceValidationError('A value slot is missing a block. Connect an indicator, price, volume, or number.');
  switch (block.type) {
    case 'indicator_ma':
      return {
        kind: 'MA',
        period: Number(block.getFieldValue('PERIOD')),
        ma_type: block.getFieldValue('TYPE'),
      };
    case 'indicator_rsi':
      return {
        kind: 'RSI',
        period: Number(block.getFieldValue('PERIOD')),
      };
    case 'indicator_atr':
      return {
        kind: 'ATR',
        period: Number(block.getFieldValue('PERIOD')),
      };
    case 'indicator_macd':
      return {
        kind: 'MACD',
        line: block.getFieldValue('OUTPUT'),
      };
    case 'indicator_bands':
      return {
        kind: 'BANDS',
        band: block.getFieldValue('BAND'),
        period: Number(block.getFieldValue('PERIOD')),
        deviation: Number(block.getFieldValue('DEVIATION')),
      };
    case 'indicator_stoch':
      return {
        kind: 'STOCH',
        stoch_line: block.getFieldValue('LINE'),
        k_period: Number(block.getFieldValue('K_PERIOD')),
        d_period: Number(block.getFieldValue('D_PERIOD')),
        slowing: Number(block.getFieldValue('SLOWING')),
      };
    case 'candle_block':
      return {
        kind: 'CANDLE',
        candle_type: block.getFieldValue('CANDLE_TYPE'),
      };
    case 'volume_block':
      return {
        kind: 'VOLUME',
        volume_bar: block.getFieldValue('BAR'),
      };
    case 'risk_value_block':
      return {
        kind: 'RISK_VALUE',
        value: Number(block.getFieldValue('VALUE')),
        unit: block.getFieldValue('UNIT'),
      };
    case 'math_multiply_block': {
      const aBlock = block.getInputTargetBlock('A');
      const bBlock = block.getInputTargetBlock('B');
      if (!aBlock || !bBlock) {
        throw new WorkspaceValidationError('A Multiply (x) block is missing one of its two inputs.');
      }
      // Defense-in-depth: the editor already stops this at connect-time
      // (see enforceMultiplyBlock), but re-check here too in case a
      // workspace was loaded from old/hand-edited XML.
      if (!categoriesCompatible(resolveCategory(aBlock), resolveCategory(bBlock))) {
        throw new WorkspaceValidationError('A Multiply (×) block combines incompatible value types (e.g. ATR × Volume) and makes no trading sense. Fix it before exporting.');
      }
      return {
        kind: 'MULTIPLY',
        left: operandFromBlock(aBlock),
        right: operandFromBlock(bBlock),
      };
    }
    case 'math_number':
      return { kind: 'NUMBER', value: Number(block.getFieldValue('NUM')) };
    default:
      throw new WorkspaceValidationError(`Unsupported block "${block.type}" used in a value slot.`);
  }
}

function conditionFromBlock(block) {
  if (!block) {
    throw new WorkspaceValidationError('The strategy rule is missing a Condition block (a comparison or a Logical Operator).');
  }
  if (block.type === 'comparison_block') {
    const leftBlock = block.getInputTargetBlock('LEFT');
    const rightBlock = block.getInputTargetBlock('RIGHT');
    // Defense-in-depth: the editor already stops this at connect-time
    // (see enforceComparisonBlock), but re-check here too in case a
    // workspace was loaded from old/hand-edited XML.
    const leftCat = resolveCategory(leftBlock);
    const rightCat = resolveCategory(rightBlock);
    if (!categoryAllowedInCondition(leftCat) || !categoryAllowedInCondition(rightCat) || !categoriesCompatible(leftCat, rightCat)) {
      throw new WorkspaceValidationError('A comparison mixes incompatible value types (e.g. a price against a volume) and would never produce a meaningful trading signal. Fix the highlighted comparison before exporting.');
    }
    return {
      type: 'comparison',
      left: operandFromBlock(leftBlock),
      operator: block.getFieldValue('OP'),
      right: operandFromBlock(rightBlock),
    };
  }
  if (block.type === 'logical_operator') {
    const aBlock = block.getInputTargetBlock('A');
    const bBlock = block.getInputTargetBlock('B');
    if (!aBlock || !bBlock) {
      throw new WorkspaceValidationError('A Logical Operator block is missing one of its two condition inputs.');
    }
    return {
      type: 'logical',
      operator: block.getFieldValue('OP'),
      left: conditionFromBlock(aBlock),
      right: conditionFromBlock(bBlock),
    };
  }
  throw new WorkspaceValidationError(`The Condition slot must contain a comparison or Logical Operator block (found "${block.type}").`);
}

// Builds one rule's wire payload from a single "IF (Strategy Rule)" block.
// `label` prefixes validation errors (e.g. "Rule 2: ...") so a mistake is
// easy to locate when the workspace has more than one rule; for a single-
// rule workspace it's left off entirely to match the original messages
// traders are already used to.
function ruleFromTradeIfBlock(ruleBlock, label) {
  const prefix = label ? `${label}: ` : '';

  const assetBlock = ruleBlock.getInputTargetBlock('ASSET');
  const timeframeBlock = ruleBlock.getInputTargetBlock('TIMEFRAME');
  const conditionBlock = ruleBlock.getInputTargetBlock('CONDITION');

  if (!assetBlock) throw new WorkspaceValidationError(`${prefix}The strategy rule is missing an Asset block.`);
  if (!timeframeBlock) throw new WorkspaceValidationError(`${prefix}The strategy rule is missing a Timeframe block.`);

  const asset = resolveAssetValue(assetBlock);
  if (!asset) {
    throw new WorkspaceValidationError(`${prefix}Enter a custom asset symbol in the Asset block, or pick one from the list.`);
  }

  const condition = conditionFromBlock(conditionBlock);

  // Walk the chained action blocks inside the "DO" statement input.
  const actions = [];
  let actionBlock = ruleBlock.getInputTargetBlock('DO');
  while (actionBlock) {
    if (actionBlock.type !== 'action_block') {
      throw new WorkspaceValidationError(`${prefix}Only "Open BUY/SELL" action blocks are allowed inside THEN.`);
    }
    const slBlock = actionBlock.getInputTargetBlock('SL');
    const tpBlock = actionBlock.getInputTargetBlock('TP');
    actions.push({
      direction: actionBlock.getFieldValue('DIRECTION'),
      lot: Number(actionBlock.getFieldValue('LOT')),
      sl: slBlock ? operandFromBlock(slBlock) : null,
      tp: tpBlock ? operandFromBlock(tpBlock) : null,
    });
    actionBlock = actionBlock.getNextBlock();
  }

  if (actions.length === 0) {
    throw new WorkspaceValidationError(`${prefix}Add at least one "Open BUY/SELL" action block inside THEN.`);
  }

  // "Positions" dropdown: SINGLE means only one open round of trades from
  // this rule at a time (maxPositions = 1); MULTIPLE reveals a "Max
  // simultaneous" field for how many concurrent rounds are allowed.
  const positionsMode = ruleBlock.getFieldValue('POSITIONS_MODE') || 'SINGLE';
  const maxPositions = positionsMode === 'MULTIPLE'
    ? Number(ruleBlock.getFieldValue('MAX_POSITIONS'))
    : 1;

  return {
    asset,
    timeframe: timeframeBlock.getFieldValue('TIMEFRAME'),
    condition,
    actions,
    max_positions: maxPositions,
  };
}

// A workspace can hold more than one independent "IF (Strategy Rule)"
// block - each becomes its own trigger inside ONE combined exported EA/
// cBot (own asset/timeframe/condition/positions, own magic number/label on
// the backend so their positions never get confused with each other - see
// main.py). Ordered by canvas position (top-to-bottom, left-to-right,
// same as Blockly's own getTopBlocks(true)) purely for a stable, visually
// predictable rule numbering - it has no effect on how the rules behave.
function serializeWorkspace(ws) {
  const topBlocks = ws.getTopBlocks(true).filter(b => b.type === 'trade_if');

  if (topBlocks.length === 0) {
    throw new WorkspaceValidationError('Add an "IF (Strategy Rule)" block to define your strategy before exporting.');
  }

  const multiple = topBlocks.length > 1;
  const rules = topBlocks.map((ruleBlock, i) => ruleFromTradeIfBlock(ruleBlock, multiple ? `Rule ${i + 1}` : null));

  return { rules };
}

/* ============================================================
   3z. AUTH (login for the 30-day pass only)
   ============================================================
   Talks directly to Supabase Auth's REST API - no SDK vendored for
   this (would pull in realtime/storage clients we don't use), just
   plain fetch calls with the project's public anon key. The backend
   (supabase_auth.py) only ever verifies the resulting access token; it
   never sees an email or password. Session (access + refresh token) is
   kept in localStorage - each new device/browser needs one login, then
   stays logged in via the refresh token until it's revoked/expires. */

const SUPABASE_URL = 'https://qlwaysrcmxoqesplcrfc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsd2F5c3JjbXhvcWVzcGxjcmZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MDU1NzYsImV4cCI6MjEwMjI4MTU3Nn0.bvn1AJXF6Xn9AMa4G4Wg2eDyJol5oeDpF-bbBha0jv0';
const AUTH_SESSION_KEY = 'algoPuzzle.auth.v1';

function getAuthSession() {
  try {
    const raw = localStorage.getItem(AUTH_SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (_) {
    return null;
  }
}
function saveAuthSession(session) {
  // Supabase's token response includes expires_in (seconds) - store an
  // absolute expiry so getValidAccessToken() below doesn't need to
  // remember when the request was made.
  const withExpiry = { ...session, expires_at_ms: Date.now() + (session.expires_in || 3600) * 1000 };
  localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(withExpiry));
  return withExpiry;
}
function clearAuthSession() {
  localStorage.removeItem(AUTH_SESSION_KEY);
}

async function supabaseAuthFetch(path, body) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    // Supabase error bodies use either `error_description` or `msg`
    // depending on the endpoint - fall back to something readable.
    throw new Error(json.error_description || json.msg || 'Authentication request failed.');
  }
  return json;
}

async function authSignUp(email, password) {
  // Without redirect_to, Supabase falls back to the project's default
  // Site URL setting for the confirmation link - which is Supabase's own
  // placeholder unless someone has configured it, so the email link goes
  // nowhere real. Same fix as authRequestPasswordReset below.
  const redirectTo = window.location.origin + window.location.pathname;
  const json = await supabaseAuthFetch(`/signup?redirect_to=${encodeURIComponent(redirectTo)}`, { email, password });
  // If email confirmation is required (Supabase project setting), signup
  // succeeds but returns no session yet. That's still a SUCCESS, not an
  // error - it used to be thrown as one, which meant "check your inbox"
  // rendered in the same red/failure styling as an actual failed signup.
  // A plain object return (instead of a session) is the caller's signal
  // to treat this as the confirmation-pending case.
  if (!json.access_token) {
    return { needsConfirmation: true };
  }
  return saveAuthSession(json);
}

async function authSignIn(email, password) {
  const json = await supabaseAuthFetch('/token?grant_type=password', { email, password });
  return saveAuthSession(json);
}

async function authRequestPasswordReset(email) {
  // redirect_to brings the trader back to this exact page with a
  // recovery token in the URL fragment - see the DOMContentLoaded
  // handler below for how that's picked up.
  await supabaseAuthFetch(`/recover?redirect_to=${encodeURIComponent(window.location.origin + window.location.pathname)}`, { email });
}

async function authSetNewPassword(newPassword, recoveryAccessToken) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${recoveryAccessToken}`,
    },
    body: JSON.stringify({ password: newPassword }),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error_description || json.msg || 'Could not set the new password.');
}

async function authSignOut() {
  const session = getAuthSession();
  clearAuthSession();
  if (session && session.access_token) {
    // Best-effort - the local session is already cleared either way,
    // this just also revokes the refresh token server-side.
    fetch(`${SUPABASE_URL}/auth/v1/logout`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${session.access_token}` },
    }).catch(() => {});
  }
}

// Returns a valid access token, refreshing it first if it's expired or
// about to be (60s buffer) - or null if never logged in / refresh
// itself fails (e.g. the refresh token was revoked), in which case the
// stale session is also cleared so the UI doesn't keep claiming to be
// logged in.
async function getValidAccessToken() {
  const session = getAuthSession();
  if (!session) return null;
  if (session.expires_at_ms - Date.now() > 60_000) return session.access_token;

  try {
    const refreshed = await supabaseAuthFetch('/token?grant_type=refresh_token', {
      refresh_token: session.refresh_token,
    });
    return saveAuthSession(refreshed).access_token;
  } catch (_) {
    clearAuthSession();
    return null;
  }
}

authSubmitBtn.addEventListener('click', async () => {
  const email = authEmailInput.value.trim();
  const password = authPasswordInput.value;
  if (!email) {
    showAuthError('Enter your email first.');
    return;
  }
  if (authMode !== 'reset' && !password) {
    showAuthError('Enter your password first.');
    return;
  }

  const originalLabel = authSubmitBtn.textContent;
  authSubmitBtn.disabled = true;
  authSubmitBtn.textContent = 'Working...';
  authError.classList.add('hidden');
  try {
    if (authMode === 'login') {
      await authSignIn(email, password);
      renderAuthStatus();
      hideAuthOverlay();
      showToast(`Logged in as ${email}.`, false);
      if (authOnSuccess) authOnSuccess();
    } else if (authMode === 'signup') {
      const result = await authSignUp(email, password);
      if (result.needsConfirmation) {
        // Real success (the account was created) with an extra step

        // every other success here, not the red error box.
        hideAuthOverlay();
        showToast('Account created - check your inbox for a confirmation link, then log in.', false);
      } else {
        renderAuthStatus();
        hideAuthOverlay();
        showToast(`Account created - logged in as ${result.user.email}.`, false);
        if (authOnSuccess) authOnSuccess();

      setAuthMode('login');

/* --- Password-reset landing: Supabase's reset email links back here
   with #access_token=...&type=recovery in the URL - if present, this
   IS a password-reset visit, show that form instead of anything else. --- */
(function handlePasswordRecoveryLanding() {
  const hash = new URLSearchParams(window.location.hash.slice(1));
  if (hash.get('type') !== 'recovery' || !hash.get('access_token')) return;

  const recoveryToken = hash.get('access_token');
  const overlay = document.getElementById('authResetOverlay');
  const errorEl = document.getElementById('authResetError');
  const errorText = document.getElementById('authResetErrorText');
  const input = document.getElementById('authNewPassword');
  const submitBtn = document.getElementById('authResetSubmitBtn');
  overlay.classList.remove('hidden');

  submitBtn.addEventListener('click', async () => {
    if (!input.value) {
      errorText.textContent = 'Enter a new password first.';
      errorEl.classList.remove('hidden');
      return;
    }
    submitBtn.disabled = true;
    errorEl.classList.add('hidden');
    try {
      await authSetNewPassword(input.value, recoveryToken);
      // Clean the token out of the URL - it's single-use and shouldn't
      // linger in browser history / be re-submitted on a page refresh.
      history.replaceState(null, '', window.location.pathname + window.location.search);
      // Toast fires before hiding the overlay (not after) so it's
      // already visible by the time the modal that was covering it
      // disappears - same reasoning as the signup flow above, where
      // hiding first meant a later crash left no visible feedback at
      // all.
      showToast('Password updated - log in with your new password.', false);
      overlay.classList.add('hidden');
    } catch (err) {
      errorText.textContent = err.message;
      errorEl.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
    }
  });
})();

// PRODUCTION_API_BASE: the deployed backend's real URL. Deliberately
// still the raw onrender.com URL, not api.algopuzzle.com - Cloudflare
// (our DNS host) refuses to point any record, CNAME or A, proxied or
// not, at Render's IP range (Cloudflare error 1000, "DNS points to
// prohibited IP" - Render's own infra is itself Cloudflare-fronted,
// which Cloudflare's DNS treats as a prohibited double-proxy target
// regardless of record type). Purely cosmetic either way - nothing in
// the UI ever shows this URL to a trader, it's only ever used here as
// a fetch() target. Only takes effect when actually served from
// algopuzzle.com/www - local dev (localhost/127.0.0.1/file://) always
// uses the port-guessing fallback below instead, regardless of this
// value, so there's no need to touch it while developing locally.
const PRODUCTION_API_BASE = 'https://algopuzzle-api.onrender.com';

const IS_LOCAL_DEV = ['localhost', '127.0.0.1', ''].includes(window.location.hostname) || window.location.protocol === 'file:';

const API_BASE = IS_LOCAL_DEV
  ? (window.location.origin.includes('null') || window.location.protocol === 'file:'
      ? 'http://127.0.0.1:8000'
      : window.location.origin.replace(/:\d+$/, ':8000'))
  : PRODUCTION_API_BASE;

/* ------------------------------------------------------------
   Billing / entitlement (no account, no login - see device_identity.py
   and billing.py on the backend). The device is identified purely by a
   signed httpOnly cookie the backend issues automatically; every fetch
   here needs `credentials: 'include'` so that cookie is actually sent,
   since the frontend and backend usually live on different origins.
   ------------------------------------------------------------ */

async function fetchBillingStatus() {
  try {
    const token = await getValidAccessToken();
    const headers = token ? { Authorization: `Bearer ${token}` } : {};
    const res = await fetch(`${API_BASE}/api/billing/status`, { credentials: 'include', headers });
    if (!res.ok) return null;
    return await res.json();
  } catch (_) {
    return null; // backend unreachable - fail silent, export itself will surface any real problem
  }
}

function renderBillingIndicator(status) {
  if (!status || !status.billing_configured) {
    billingIndicator.classList.add('hidden');
    return;

  let label;
  if (status.pass_active) {
    const until = status.pass_expires_at ? new Date(status.pass_expires_at).toLocaleDateString() : '';
    label = `Unlimited pass active${until ? ` (until ${until})` : ''}`;
  } else if (status.paid_export_credits > 0) {
    label = `${status.paid_export_credits} paid export${status.paid_export_credits === 1 ? '' : 's'} available`;
  } else {
    label = `${status.free_exports_remaining} free export${status.free_exports_remaining === 1 ? '' : 's'} left`;
  }
  billingIndicator.textContent = label;
  billingIndicator.classList.remove('hidden');
}

async function startCheckout(kind) {
  // The 30-day pass is the one purchase that needs login (see
  // billing.LoginRequired) - if there's no valid session yet, collect
  // one first, then resume straight into checkout on success rather
  // than making the trader click "buy" a second time.
  if (kind === 'pass' && !(await getValidAccessToken())) {
    hidePaywall();
    showAuthOverlay(() => startCheckout('pass'));
    return;
  }

  const endpoint = kind === 'pass' ? '/api/billing/checkout/pass' : '/api/billing/checkout/export';
  try {
    const token = await getValidAccessToken();
    const headers = token ? { Authorization: `Bearer ${token}` } : {};
    const res = await fetch(`${API_BASE}${endpoint}`, { method: 'POST', credentials: 'include', headers });
    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}));
      throw new Error((errJson.detail && errJson.detail.message) || errJson.detail || 'Could not start checkout.');
    }
    const { url } = await res.json();
    window.location.href = url; // hands off to Stripe's own hosted Checkout page
  } catch (err) {
    hidePaywall();
    showToast('Payment could not be started: ' + err.message, true);
  }
}

// Coming back from Stripe Checkout - success_url/cancel_url (see
// billing.py) tag the return with ?checkout=success|cancel so we can
// show a toast and refresh the indicator without the user re-checking.
(function handleCheckoutReturn() {
  const params = new URLSearchParams(window.location.search);
  const checkout = params.get('checkout');
  if (!checkout) return;
  if (checkout === 'success') {
    const kind = params.get('kind');
    showToast(kind === 'pass' ? 'Payment received - unlimited exports unlocked for 30 days.' : 'Payment received - export credit added.', false);
  } else if (checkout === 'cancel') {
    showToast('Payment cancelled - no charge was made.', true);
  }
  // Clean the query string so a page refresh doesn't re-show the toast.
  params.delete('checkout');
  params.delete('kind');
  const cleanUrl = window.location.pathname + (params.toString() ? `?${params}` : '');
  window.history.replaceState({}, '', cleanUrl);
})();

  showToast._t = setTimeout(() => toast.classList.add('hidden'), 6000);
}

// Short filename-safe slug identifying the exported strategy: the asset
// when there's exactly one rule (matches the original single-rule
// filenames traders already know), or up to 3 distinct assets joined
// together, or "multi_Nrules" once it's too many to usefully list.
function assetSlugForFilename(rules) {
  const distinctAssets = [...new Set(rules.map(r => r.asset.toLowerCase()))];
  if (distinctAssets.length <= 3) return distinctAssets.join('_');
  return `multi_${rules.length}rules`;
}

// Shared by all export buttons - same Blockly-workspace payload, same
// download-a-.zip flow, only the endpoint / filename prefix / button /
// in-flight status label differ per target platform.
async function exportStrategy({ endpoint, filenamePrefix, button, busyLabel }) {
  let payload;
  try {
    payload = serializeWorkspace(workspace);
  } catch (err) {
    if (err instanceof WorkspaceValidationError) {
      showToast(err.message, true);
      return;
    }
    showToast('Unexpected error reading the workspace: ' + err.message, true);
    return;
  }

  exportButtons.forEach(b => { b.disabled = true; });
  statusMsg.textContent = busyLabel;

  try {
    // Authorization is only added if actually logged in - lets the
    // backend grant via an active 30-day pass first (see
    // _require_export_entitlement in main.py) before ever falling back
    // to the anonymous device_id cookie's free/credit balance.
    const token = await getValidAccessToken();
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers.Authorization = `Bearer ${token}`;
    const res = await fetch(`${API_BASE}${endpoint}`, {
      method: 'POST',
      headers,
      credentials: 'include', // sends the anonymous device cookie - see device_identity.py
      body: JSON.stringify(payload),
    });

    if (res.status === 402) {
      const errJson = await res.json().catch(() => ({}));
      const message = errJson.detail && errJson.detail.message ? errJson.detail.message : undefined;
      showPaywall(message);
      return;
    }

    if (!res.ok) {
      let detail = 'Failed to generate the strategy export.';
      try {
        const errJson = await res.json();
        detail = errJson.detail ? JSON.stringify(errJson.detail) : detail;
      } catch (_) {}
      throw new Error(detail);
    }

    const blob = await res.blob();
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${filenamePrefix}_${assetSlugForFilename(payload.rules)}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);

    // Not a warning, just a heads-up - multiple "IF" blocks on the canvas
    // are fully supported (see main.py), but a trader building several at
    // once should still know they all just got bundled into one file.
    const ruleCountNote = payload.rules.length > 1
      ? ` (${payload.rules.length} strategy rules combined into one file)`
      : '';
    showToast(`Export complete! Your .zip download has started.${ruleCountNote}`, false);
    refreshBillingIndicator(); // this export just consumed a free/paid credit - reflect it immediately
  } catch (err) {
    showToast('Export failed: ' + err.message, true);
  } finally {
    exportButtons.forEach(b => { b.disabled = false; });
    statusMsg.textContent = '';
  }
}
