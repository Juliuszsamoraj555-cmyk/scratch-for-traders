# Render Blueprint - https://render.com/docs/blueprint-spec
# Lets Render provision both services from this one file ("New +" ->
# "Blueprint" in the Render dashboard, pointed at this repo) instead of
# clicking through service creation by hand. Field names match Render's
# blueprint spec as of when this was written - if Render's dashboard
# shows a different option name for something below, trust the
# dashboard and adjust this file to match.
#
# `sync: false` env vars are intentionally left blank here - Render will
# prompt for them once during the Blueprint's first deploy (or set them
# later in the service's Environment tab). Never put real secret values
# in this file; it's committed to the repo.

services:
  - type: web
    name: algopuzzle-api
    env: python
    plan: free
    region: frankfurt # matches the Supabase project's region (West EU/Ireland) - was defaulting to Oregon, which caused sporadic 500s/timeouts talking to the database across that much distance
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8 # Render defaults to 3.14, which pydantic-core (via PyO3) doesn't support yet - see .env.example
      - key: DATABASE_URL
        sync: false # Supabase connection string - see .env.example
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_EXPORT
        sync: false
      - key: STRIPE_PRICE_PASS
        sync: false
      - key: STRIPE_PRICE_EXPORT_PLN
        sync: false # optional - only needed for BLIK/Przelewy24, see .env.example. Leave blank in the Render dashboard to skip PLN checkout entirely.
      - key: STRIPE_PRICE_PASS_PLN
        sync: false # optional - same as above
      - key: SUPABASE_URL
        sync: false # Project Settings -> API - login for the 30-day pass only
      - key: SUPABASE_ANON_KEY
        sync: false # same page - public by design, but kept as an env var like the rest
      - key: SUPABASE_JWT_SECRET
        sync: false # Project Settings -> API -> JWT Settings - a real secret, unlike the anon key above
      - key: COOKIE_SIGNING_SECRET
        generateValue: true # Render generates a random secret automatically
      - key: COOKIE_DOMAIN
        sync: false # leave BLANK - the API stays on algopuzzle-api.onrender.com (see PRODUCTION_API_BASE in index_1.html for why), not a subdomain of algopuzzle.com, so there's no shared parent domain to scope the cookie to. A browser silently drops any Set-Cookie whose Domain isn't the response's own host or a parent of it.
      - key: ALLOWED_ORIGINS
        sync: false # https://algopuzzle.com (the frontend's URL)
      - key: SITE_URL
        sync: false # https://algopuzzle.com - used for Stripe redirect URLs

  - type: web
    name: algopuzzle-frontend
    env: static
    buildCommand: ""
    staticPublishPath: "."
    # index_1.html's PRODUCTION_API_BASE is already set to
    # https://algopuzzle-api.onrender.com - deliberately NOT a custom
    # api.algopuzzle.com subdomain, since Cloudflare (our DNS host)
    # refuses to point any record at Render's IP range (error 1000) -
    # see the comment on PRODUCTION_API_BASE itself for the full story.
    # Purely internal either way, never shown to a trader.
