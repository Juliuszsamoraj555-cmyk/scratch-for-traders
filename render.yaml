# Render Blueprint - https://render.com/docs/blueprint-spec
# Lets Render provision both services from this one file ("New +" ->
# "Blueprint" in the Render dashboard, pointed at this repo) instead of
# clicking through service creation by hand. Field names match Render's
# blueprint spec as of when this was written - if Render's dashboard
# shows a different option name for something below, trust the
# dashboard and adjust this file to match.
#
# `sync: false` env vars are intentionally left blank here - Render will
# prompt for them once during the Blueprint's first deploy (or set them
# later in the service's Environment tab). Never put real secret values
# in this file; it's committed to the repo.

services:
  - type: web
    name: algopuzzle-api
    env: python
    plan: free
    region: frankfurt # matches the Supabase project's region (West EU/Ireland) - was defaulting to Oregon, which caused sporadic 500s/timeouts talking to the database across that much distance
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8 # Render defaults to 3.14, which pydantic-core (via PyO3) doesn't support yet - see .env.example
      - key: DATABASE_URL
        sync: false # Supabase connection string - see .env.example
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_EXPORT
        sync: false
      - key: STRIPE_PRICE_PASS
        sync: false
      - key: SUPABASE_URL
        sync: false # Project Settings -> API - login for the 30-day pass only
      - key: SUPABASE_ANON_KEY
        sync: false # same page - public by design, but kept as an env var like the rest
      - key: SUPABASE_JWT_SECRET
        sync: false # Project Settings -> API -> JWT Settings - a real secret, unlike the anon key above
      - key: COOKIE_SIGNING_SECRET
        generateValue: true # Render generates a random secret automatically
      - key: COOKIE_DOMAIN
        sync: false # leave BLANK - the API stays on algopuzzle-api.onrender.com (see PRODUCTION_API_BASE in index_1.html for why), not a subdomain of algopuzzle.com, so there's no shared parent domain to scope the cookie to. A browser silently drops any Set-Cookie whose Domain isn't the response's own host or a parent of it.
      - key: ALLOWED_ORIGINS
        sync: false # https://algopuzzle.com (the frontend's URL)
      - key: SITE_URL
        sync: false # https://algopuzzle.com - used for Stripe redirect URLs

  - type: web
    name: algopuzzle-frontend
    env: static
    buildCommand: ""
    staticPublishPath: "."
    # index_1.html's PRODUCTION_API_BASE is already set to
    # https://algopuzzle-api.onrender.com - deliberately NOT a custom
    # api.algopuzzle.com subdomain, since Cloudflare (our DNS host)
    # refuses to point any record at Render's IP range (error 1000) -
    # see the comment on PRODUCTION_API_BASE itself for the full story.
    # Purely internal either way, never shown to a trader.
    #
    # --- SEO Phase 1 (2026-08-24): clean-URL migration, see docs/HANDOFF.md
    # Session 6. On-disk filenames are unchanged (index.html, index_1.html,
    # blog/<slug>.html) - only how they're addressed over HTTP changes.
    #
    # EMERGENCY FIX (same day): the original version of this block ALSO had
    # a redirect from every legacy ".html" URL to its clean form (e.g.
    # /blog/foo.html -> /blog/foo/). That's gone now - it caused a live
    # ERR_TOO_MANY_REDIRECTS outage on /builder/ and every /blog/<slug>/
    # URL within minutes of deploying, confirmed in a real browser (repeated
    # 301s to the same URL). Root cause: Render's "rewrite" below serves
    # /blog/foo/ by internally dispatching to /blog/foo.html - but it
    # re-evaluates that destination path against the FULL routes list
    # (contrary to how a passthrough/rewrite is usually assumed to behave),
    # so it kept re-matching the now-removed redirect rule and bouncing
    # straight back to /blog/foo/, forever. Removing that redirect block
    # breaks the cycle: /blog/foo.html no longer matches any rule, so the
    # rewrite's destination just falls through to normal static file
    # serving. Net effect: a bookmark/old link to the .html form still
    # works (serves the same content directly, unchanged from before this
    # migration) - it just no longer 301s to the clean form. Revisit only
    # with real, live-tested evidence of a loop-safe pattern - don't
    # re-add this block from memory/assumption again.
    #
    # What's left below:
    #   1. "redirect" (301) - no-trailing-slash -> trailing-slash only,
    #      so there's one canonical clean form (not two).
    #   2. "rewrite" (invisible - browser URL bar keeps showing the clean
    #      form) - actually serves the real file from its clean URL.
    # `/` and `/blog/` need no rules: Render's static server already
    # serves index.html for a directory request by default (this is how
    # both already worked before this migration).
    routes:
      # --- 301: no-trailing-slash -> trailing-slash (one canonical form
      # only - avoids recreating the exact duplicate-URL problem this
      # migration fixes) ---
      - type: redirect
        source: /builder
        destination: /builder/
      - type: redirect
        source: /blog/backtesting-vs-demo-trading
        destination: /blog/backtesting-vs-demo-trading/
      - type: redirect
        source: /blog/how-to-build-a-trading-bot-without-coding
        destination: /blog/how-to-build-a-trading-bot-without-coding/
      - type: redirect
        source: /blog/how-to-build-your-first-algorithmic-strategy
        destination: /blog/how-to-build-your-first-algorithmic-strategy/
      - type: redirect
        source: /blog/market-limit-stop-orders-explained
        destination: /blog/market-limit-stop-orders-explained/
      - type: redirect
        source: /blog/mt4-vs-mt5-vs-ctrader-automation
        destination: /blog/mt4-vs-mt5-vs-ctrader-automation/
      - type: redirect
        source: /blog/position-sizing-how-much-to-risk
        destination: /blog/position-sizing-how-much-to-risk/
      - type: redirect
        source: /blog/stop-loss-take-profit-guide
        destination: /blog/stop-loss-take-profit-guide/
      - type: redirect
        source: /blog/trading-indicators-explained
        destination: /blog/trading-indicators-explained/
      - type: redirect
        source: /blog/what-is-algorithmic-trading
        destination: /blog/what-is-algorithmic-trading/
      - type: redirect
        source: /blog/what-is-an-expert-advisor
        destination: /blog/what-is-an-expert-advisor/

      # --- rewrite: serve the real file, keep the clean URL in the
      # browser's address bar ---
      - type: rewrite
        source: /builder/
        destination: /index_1.html
      - type: rewrite
        source: /blog/backtesting-vs-demo-trading/
        destination: /blog/backtesting-vs-demo-trading.html
      - type: rewrite
        source: /blog/how-to-build-a-trading-bot-without-coding/
        destination: /blog/how-to-build-a-trading-bot-without-coding.html
      - type: rewrite
        source: /blog/how-to-build-your-first-algorithmic-strategy/
        destination: /blog/how-to-build-your-first-algorithmic-strategy.html
      - type: rewrite
        source: /blog/market-limit-stop-orders-explained/
        destination: /blog/market-limit-stop-orders-explained.html
      - type: rewrite
        source: /blog/mt4-vs-mt5-vs-ctrader-automation/
        destination: /blog/mt4-vs-mt5-vs-ctrader-automation.html
      - type: rewrite
        source: /blog/position-sizing-how-much-to-risk/
        destination: /blog/position-sizing-how-much-to-risk.html
      - type: rewrite
        source: /blog/stop-loss-take-profit-guide/
        destination: /blog/stop-loss-take-profit-guide.html
      - type: rewrite
        source: /blog/trading-indicators-explained/
        destination: /blog/trading-indicators-explained.html
      - type: rewrite
        source: /blog/what-is-algorithmic-trading/
        destination: /blog/what-is-algorithmic-trading.html
      - type: rewrite
        source: /blog/what-is-an-expert-advisor/
        destination: /blog/what-is-an-expert-advisor.html
