<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- ============================================================
     See assets/marketplace-data.js for the real purchase-record fetch
     this reads from. Site-side "library" of everything this device owns, separate from
     (but linking to the same strategy-detail.html pages as) the
     compact Drafts/Purchases tab inside the Builder's "My Strategies"
     panel - added per explicit request: someone who comes back to the
     marketplace site directly, without opening the Builder, still has
     somewhere to see what they've bought. noindex - personal, per-
     device data, nothing here should ever be crawled/indexed.
     ============================================================ -->
<title>My Purchases - AlgoPuzzle</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#030712" />

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="assets/vendor/tailwind/tailwind-compiled.css" />
<style>
  html { scroll-behavior: smooth; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>
</head>
<body class="bg-gray-950 text-gray-100">

  <header class="sticky top-0 z-40 bg-gray-950/90 backdrop-blur border-b border-gray-800">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(1,1) scale(0.175)">
            <path d="M10,0 L70,0 A10,10 0 0,1 80,10 L80,26 A14,14 0 0,1 80,54 L80,70 A10,10 0 0,1 70,80 L54,80 A14,14 0 0,1 26,80 L10,80 A10,10 0 0,1 0,70 L0,10 A10,10 0 0,1 10,0 Z" fill="#f9fafb" stroke="#059669" stroke-width="3"/>
            <path d="M90,0 L150,0 A10,10 0 0,1 160,10 L160,70 A10,10 0 0,1 150,80 L134,80 A14,14 0 0,1 106,80 L90,80 A10,10 0 0,1 80,70 L80,54 A14,14 0 0,0 80,26 L80,10 A10,10 0 0,1 90,0 Z" fill="#10b981" stroke="#059669" stroke-width="3"/>
            <path d="M10,80 L26,80 A14,14 0 0,0 54,80 L70,80 A10,10 0 0,1 80,90 L80,106 A14,14 0 0,1 80,134 L80,150 A10,10 0 0,1 70,160 L10,160 A10,10 0 0,1 0,150 L0,90 A10,10 0 0,1 10,80 Z" fill="#10b981" stroke="#059669" stroke-width="3"/>
            <path d="M90,80 L106,80 A14,14 0 0,0 134,80 L150,80 A10,10 0 0,1 160,90 L160,150 A10,10 0 0,1 150,160 L90,160 A10,10 0 0,1 80,150 L80,134 A14,14 0 0,0 80,106 L80,90 A10,10 0 0,1 90,80 Z" fill="#f9fafb" stroke="#059669" stroke-width="3"/>
          </g>
        </svg>
        <span class="font-semibold text-gray-100 tracking-tight">Algo<span class="text-emerald-400">Puzzle</span></span>
      </a>
      <nav class="hidden md:flex items-center gap-8 text-sm text-gray-400">
        <a href="strategy-of-the-week.html" class="hover:text-gray-100 transition">&larr; Strategy of the Week</a>
        <a href="my-purchases.html" class="text-emerald-400 font-medium">My Purchases</a>
      </nav>
      <a href="index_1.html" class="bg-emerald-500 hover:bg-emerald-400 text-gray-900 text-sm font-semibold px-4 py-2 rounded-md shadow transition">
        Open the Builder
      </a>
    </div>
  </header>

  <section class="max-w-4xl mx-auto px-6 pt-14 pb-4">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-50">My Purchases</h1>
    <p class="mt-3 text-sm text-gray-400 max-w-xl">Every strategy you've bought (or claimed for free), tied to this browser. Access never expires.</p>
  </section>

  <main id="content" class="max-w-4xl mx-auto px-6 pb-20"></main>

<script src="assets/marketplace-data.js"></script>
<script>
function fmtStat(v, suffix) {
  return (v === null || v === undefined) ? '—' : `${v}${suffix}`;
}

function render() {
  const owned = getOwnedMarketplaceStrategies();
  const contentEl = document.getElementById('content');

  if (owned.length === 0) {
    contentEl.innerHTML = `
      <div class="border border-gray-800 rounded-xl p-10 text-center">
        <p class="text-sm text-gray-500">You haven't bought anything yet.</p>
        <a href="strategy-of-the-week.html" class="mt-4 inline-flex items-center gap-1.5 text-sm font-semibold bg-emerald-500 hover:bg-emerald-400 text-gray-900 px-4 py-2.5 rounded-md">
          Go to Marketplace
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    `;
    return;
  }

  contentEl.innerHTML = `
    <div class="grid sm:grid-cols-2 gap-4">
      ${owned.map((s) => `
        <a href="strategy-detail.html?id=${s.id}" class="block bg-gray-900/60 border border-gray-800 hover:border-emerald-700 rounded-xl p-5 transition">
          <span class="text-xs font-medium text-gray-500">${s.style} &middot; ${s.timeframe}</span>
          <h3 class="mt-1.5 text-sm font-bold text-gray-100">${s.name}</h3>
          <div class="mt-3 flex gap-5">
            <div><div class="text-base font-bold text-emerald-300">${fmtStat(s.stats.winRate, '%')}</div><div class="text-[11px] text-gray-500">win rate</div></div>
            <div><div class="text-base font-bold text-emerald-300">${s.stats.returnPct > 0 ? '+' : ''}${fmtStat(s.stats.returnPct, '%')}</div><div class="text-[11px] text-gray-500">return</div></div>
            <div><div class="text-base font-bold text-gray-100">${fmtStat(s.stats.trades, '')}</div><div class="text-[11px] text-gray-500">trades</div></div>
          </div>
          <span class="mt-3 inline-flex items-center gap-1 text-xs font-medium text-emerald-400">View &amp; download
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>
      `).join('')}
    </div>
  `;
}

(async () => {
  await initMarketplaceOwnership();
  render();
})();
</script>
</body>
</html>
