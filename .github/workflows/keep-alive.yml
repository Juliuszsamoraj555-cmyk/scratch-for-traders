name: Keep backend warm

# Render's free plan spins the API down after ~15 minutes with no
# incoming HTTP traffic, and the next request then pays a cold-start
# penalty (seen as a ~15-60s wait on export, and the billing
# indicator / "Go unlimited" button silently never appearing because
# their status fetch has no loading state - see index_1.html's
# fetchBillingStatus). Pinging /api/health well inside that 15-minute
# window keeps the instance from ever spinning down during normal
# hours, so real visitors stop paying that cold-start cost.
#
# Render's free tier includes 750 instance-hours/month; ping-induced
# uptime for a single service comes to roughly 720-740hrs/month
# (24/7), which fits under that with the frontend static site costing
# nothing extra (static sites don't spin down or consume this quota).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -fsS --max-time 30 https://algopuzzle-api.onrender.com/api/health || true
